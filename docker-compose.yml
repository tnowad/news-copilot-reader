version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: news_copilot
      POSTGRES_USER: news_copilot
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_copilot -d news_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./news-copilot-backend
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://news_copilot:password@db:5432/news_copilot
      REDIS_URL: redis://redis:6379/0
      CACHE_TYPE: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./news-copilot-backend:/app
      - uploads_data:/app/uploads

  frontend:
    build: ./news-copilot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000
    volumes:
      - ./news-copilot-frontend/src:/app/src

volumes:
  postgres_data:
  redis_data:
  uploads_data:
